name: Refresh 35%+ deal intelligence
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh and gate all deals
        run: |
          python scripts/refresh_deals.py
          python scripts/build_site.py
          python -m unittest discover -s tests -v
      - name: Commit site snapshot and review queue
        run: |
          git config user.name "CDG Deal Signal Bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/index.html site/deals.json data/review_queue.json data/refresh_status.json
          git diff --staged --quiet || (git commit -m "Refresh 35%+ eligible offers" && git push)
